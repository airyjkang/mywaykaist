<title>My Way KAIST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>/*__LEAFLET_CSS__*/</style>
<style>
/* Layout: one-screen tool. Desktop = control column + map; phone = map on top, controls below. */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --ink:#16201b; --muted:#5a685f; --line:#d5ddd7;
  --accent:#0d7a69; --accent-ink:#ffffff; --short:#4f5a66; --me:#2f6fe0;
  --sun:#e19b12; --mid:#b9a777; --shade:#2d5e74; --cover:#3a78c2; --indoor:#7a57b8;
  --open:#2b9550; --closed:#c4443a; --unk:#8a958e;
  --mapbg:#eceee8; --campus-fill:#e3ebe2; --green:#cfe3c4; --water:#a9cfe6; --water-line:#7fb3d3;
  --road:#ffffff; --road-edge:#c9cdc5; --bld:#d3d1c9; --bld-line:#b5b2a8; --shadow:#1d3a48; --campus:#7f9a88;
  --label:#2b3530; --label-halo:#f6f7f3; --label-green:#3d6b3a; --label-water:#2c6c94;
  --font-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101613; --surface:#171f1b; --ink:#e4ebe6; --muted:#97a69d; --line:#2a3530;
  --accent:#36c0a5; --accent-ink:#06231d; --short:#a5afb9; --me:#6c9df5;
  --sun:#f1b33a; --mid:#a8986c; --shade:#76aec6; --cover:#6aa6ea; --indoor:#ab8ae2;
  --open:#4cc172; --closed:#e3675c; --unk:#77847c;
  --mapbg:#151a17; --campus-fill:#19211c; --green:#1f3122; --water:#1d3a4d; --water-line:#2d5873;
  --road:#2c3430; --road-edge:#1e2421; --bld:#343a36; --bld-line:#454c47; --shadow:#000000; --campus:#5f7a68;
  --label:#d9e1dc; --label-halo:#101613; --label-green:#8fc08a; --label-water:#86bde0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#171f1b; --ink:#e4ebe6; --muted:#97a69d; --line:#2a3530;
  --accent:#36c0a5; --accent-ink:#06231d; --short:#a5afb9; --me:#6c9df5;
  --sun:#f1b33a; --mid:#a8986c; --shade:#76aec6; --cover:#6aa6ea; --indoor:#ab8ae2;
  --open:#4cc172; --closed:#e3675c; --unk:#77847c;
  --mapbg:#151a17; --campus-fill:#19211c; --green:#1f3122; --water:#1d3a4d; --water-line:#2d5873;
  --road:#2c3430; --road-edge:#1e2421; --bld:#343a36; --bld-line:#454c47; --shadow:#000000; --campus:#5f7a68;
  --label:#d9e1dc; --label-halo:#101613; --label-green:#8fc08a; --label-water:#86bde0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.app{height:100%;display:grid;grid-template-columns:minmax(320px,390px) 1fr;}
.panel{overflow-y:auto;border-right:1px solid var(--line);background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
#map{height:100%;background:var(--mapbg)}
.mapwrap{position:relative;min-width:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto;min-height:100%}
  .mapwrap{order:-1;height:52vh}
  .panel{border-right:0;border-top:1px solid var(--line);overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px))}
}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px}
.tabs button,.seg button,.tools button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:6px;padding:7px 8px;cursor:pointer}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"],.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.od{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--ink)}
.dot.o{background:var(--surface)} .dot.d{background:var(--ink)}
input[type=text],input[type=date],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.pick{font:inherit;font-size:12px;color:var(--accent);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 8px;cursor:pointer;white-space:nowrap}
.pick[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slider{display:grid;grid-template-columns:72px 1fr 42px;gap:8px;align-items:center}
.slider input{width:100%;accent-color:var(--accent)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12.5px}
.slider .num{text-align:right;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px;gap:3px}
.seg button{font-size:13px;padding:5px 4px}
.when{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.when .t{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;grid-column:1/-1}
.when input[type=range]{width:100%;accent-color:var(--accent)}
.live{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--unk)}
.live[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)} .live[aria-pressed="true"]::before{background:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;padding:8px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);margin:0}
.note.warn{border-color:color-mix(in srgb,var(--sun) 60%,var(--line))}
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cmp table{width:100%;border-collapse:collapse}
.cmp th,.cmp td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-size:12px;font-weight:500;color:var(--muted)}
.cmp td:first-child,.cmp th:first-child{text-align:left;color:var(--muted);font-size:12.5px}
.cmp .mine{color:var(--accent);font-weight:500}
.cmp th .sw{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.why{padding:9px 10px;font-size:13px;border-top:1px solid var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.tools button{font-size:13px}
.insp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.insp h3{margin:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:240px;overflow-y:auto}
.list div{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.list div:last-child{border-bottom:0}
.list button{font:inherit;font-size:12px;color:var(--closed);background:none;border:0;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stats b{display:block;font-family:var(--font-num);font-size:16px}
.stats span{font-size:11.5px;color:var(--muted)}
footer{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.legend{position:absolute;z-index:500;right:max(10px,env(safe-area-inset-right,0px));bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;display:grid;gap:3px;color:var(--ink)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .sq{height:10px;width:12px}
.legend .road{height:7px;background:var(--road);box-shadow:0 0 0 1px var(--road-edge)}
@media (max-width:760px){.legend{grid-template-columns:1fr 1fr;column-gap:10px;font-size:11px;bottom:18px}}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--unk)}
.status.ok::before{background:var(--open)} .status.local::before{background:var(--sun)}
.leaflet-container{background:var(--mapbg);font-family:var(--font-ui)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--accent)!important}
.leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-tooltip{background:var(--surface);color:var(--ink);border-color:var(--line);font-size:12px}
.leaflet-tooltip-top:before{border-top-color:var(--surface)}
/* 지도 글자: 확대 단계(z15/z16/z17)에 따라 큰 건물부터 보임 */
.lbl{white-space:nowrap;font-size:11px;font-weight:500;color:var(--label);pointer-events:none;
  text-shadow:0 0 2px var(--label-halo),0 0 2px var(--label-halo),0 0 3px var(--label-halo);transform:translate(-50%,-50%);width:max-content}
.lbl.green{color:var(--label-green);font-style:italic} .lbl.water{color:var(--label-water);font-style:italic}
.lbl.t1{font-size:12px}
#map .lbl{display:none}
#map.z15 .lbl.t1, #map.z16 .lbl.t1, #map.z16 .lbl.t2, #map.z17 .lbl{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="panel">
    <header>
      <h1>My Way KAIST</h1>
      <p>최단거리가 항상 정답일까? 내 기준으로 고르는 캠퍼스 보행 경로</p>
    </header>
    <div class="tabs" role="group" aria-label="화면">
      <button id="tab-route" aria-pressed="true">경로 찾기</button>
      <button id="tab-survey" aria-pressed="false">현장조사</button>
    </div>

    <section id="sec-route">
      <div class="group">
        <span class="label">출발 · 도착</span>
        <div class="od">
          <span class="dot o" aria-hidden="true"></span>
          <input id="in-o" type="text" list="bl" placeholder="건물 이름 또는 지도에서 선택" autocomplete="off">
          <button class="pick" id="pick-o" aria-pressed="false">지도에서</button>
          <span class="dot d" aria-hidden="true"></span>
          <input id="in-d" type="text" list="bl" placeholder="건물 이름 또는 지도에서 선택" autocomplete="off">
          <button class="pick" id="pick-d" aria-pressed="false">지도에서</button>
        </div>
        <datalist id="bl"></datalist>
        <div class="row"><button class="btn" id="btn-loc">내 위치에서 출발</button><button class="btn" id="swap">출발·도착 바꾸기</button></div>
        <span class="hint" id="od-hint"></span>
      </div>

      <div class="group">
        <span class="label">언제 걷나요</span>
        <div class="when">
          <button class="live" id="btn-now" aria-pressed="true">지금</button>
          <input id="in-date" type="date" aria-label="날짜">
          <div class="t"><input id="in-time" type="range" min="300" max="1260" step="10" aria-label="시각"><span class="num" id="out-time">--:--</span></div>
        </div>
        <span class="hint" id="sun-hint"></span>
      </div>

      <div class="group">
        <span class="label">나에게 중요한 것</span>
        <div class="slider"><label for="w-d">짧은 거리</label><input id="w-d" type="range" min="0" max="100" value="30"><span class="num" id="o-d"></span></div>
        <div class="slider"><label for="w-s">그늘</label><input id="w-s" type="range" min="0" max="100" value="50"><span class="num" id="o-s"></span></div>
        <div class="slider"><label for="w-r">비 피하기</label><input id="w-r" type="range" min="0" max="100" value="20"><span class="num" id="o-r"></span></div>
        <label class="row hint"><input type="checkbox" id="no-stairs"> 계단 있는 길은 아예 빼기</label>
      </div>

      <div class="group">
        <span class="label">최단 경로보다 얼마나 더 걸어도 되나요</span>
        <div class="seg" role="group" aria-label="우회 한도" id="seg-alpha">
          <button data-a="0.1" aria-pressed="false">+10%</button>
          <button data-a="0.3" aria-pressed="true">+30%</button>
          <button data-a="0.5" aria-pressed="false">+50%</button>
          <button data-a="9" aria-pressed="false">제한 없음</button>
        </div>
      </div>

      <div id="result"></div>
    </section>

    <section id="sec-survey" hidden>
      <div class="row" style="justify-content:space-between">
        <span class="status" id="store-status">저장소 연결 중</span>
        <span class="hint" id="store-count"></span>
      </div>
      <div class="tools" role="group" aria-label="조사 도구" id="tools">
        <button data-t="ent" aria-pressed="true">입구 상태</button>
        <button data-t="newent" aria-pressed="false">입구 추가</button>
        <button data-t="bld" aria-pressed="false">건물 통과</button>
        <button data-t="edge" aria-pressed="false">길 속성</button>
        <button data-t="short" aria-pressed="false">지름길 그리기</button>
      </div>
      <p class="hint" id="tool-help"></p>
      <div id="insp"></div>
      <div class="stats" id="stats"></div>
      <div class="group">
        <span class="label">조사 기록</span>
        <div class="list" id="items"></div>
      </div>
      <div class="row">
        <button class="btn" id="btn-export">기록 파일로 저장</button>
        <label class="btn" for="file-import">기록 불러오기</label>
        <input id="file-import" type="file" accept=".json,application/json" hidden>
      </div>
    </section>

    <footer id="foot"></footer>
  </aside>
  <div class="mapwrap">
    <div id="map" role="application" aria-label="KAIST 지도"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const D = /*__DATA__*/null;
/* ================= 기본 상수와 가정 ================= */
const WALK = 1.3;          // 보행 속도 m/s (≈4.7 km/h), 현장 실측으로 보정 예정
const STAIR_SLOW = 1.5;    // 계단 구간 소요시간 배수
const BASE = 0.05;         // 모든 가중치가 0에 가까울 때 길을 헤매지 않도록 넣는 최소 거리 비용
const INDOOR_FACTOR = 1.2; // 건물 내부 이동 거리 = 입구 간 직선거리 × 1.2
const TREE_H = 8, TREE_R = 3; // 나무 높이·수관 반지름 가정(m)
const STEP = 2;            // 그늘 판정 간격(m): 길을 2 m마다 점으로 나눠 그림자 안인지 검사
const LAT0 = 36.372, LON0 = 127.363, MX = 111320 * Math.cos(LAT0 * Math.PI / 180), MY = 110574;
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dist = (a, b) => Math.hypot((a[0] - b[0]) * MX, (a[1] - b[1]) * MY);
const toXY = p => [(p[0] - LON0) * MX, (p[1] - LAT0) * MY];
const fmtM = m => m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
const fmtT = s => { s = Math.round(s); return Math.floor(s / 60) + '분 ' + String(s % 60).padStart(2, '0') + '초'; };
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ================= 원본 데이터 정리 ================= */
const NODE = new Map(D.nodes.map(n => [String(n[0]), [n[1], n[2]]]));
const BASE_EDGES = D.edges.map((e, i) => ({ i, u: String(e[0]), v: String(e[1]), len: e[2], cov: e[3], steps: e[4], hw: e[5], coords: e[6], way: e[7] }));
const EKEY = new Map(BASE_EDGES.map(e => [`${e.way}:${e.u}:${e.v}`, e.i]));
const BLD = D.buildings.map(b => ({ id: String(b[0]), name: b[1], h: b[2], assumed: !!b[3], rings: b[4], lp: b[5], area: b[6] }));
const BLD_BY = new Map(BLD.map(b => [b.id, b]));
const ENT = D.entrances.map(e => ({ id: String(e[0]), lon: e[1], lat: e[2], b: e[3] == null ? null : String(e[3]), kind: e[4] }));
const CAR = new Set(['primary', 'primary_link', 'secondary', 'secondary_link', 'tertiary', 'tertiary_link', 'unclassified', 'residential', 'living_street', 'service', 'road']);
const ROAD_W = { primary: 9, primary_link: 6, secondary: 8, secondary_link: 6, tertiary: 7, tertiary_link: 5, unclassified: 5.5, residential: 5, living_street: 5, service: 4, road: 5 };

/* ================= 태양 위치 (NOAA 태양 계산식) =================
   날짜·시각(UTC)과 위경도 -> 태양 고도(alt)·방위각(az, 북=0°, 시계방향) */
function sunPos(date, lat = LAT0, lon = LON0) {
  const rad = Math.PI / 180, deg = 180 / Math.PI;
  const jd = date.getTime() / 86400000 + 2440587.5, T = (jd - 2451545) / 36525;
  const L0 = ((280.46646 + T * (36000.76983 + T * 0.0003032)) % 360 + 360) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T), e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(M * rad) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * M * rad) * (0.019993 - 0.000101 * T) + Math.sin(3 * M * rad) * 0.000289;
  const om = 125.04 - 1934.136 * T, lam = L0 + C - 0.00569 - 0.00478 * Math.sin(om * rad);
  const eps = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60 + 0.00256 * Math.cos(om * rad);
  const decl = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const y = Math.tan(eps * rad / 2) ** 2;

    if (n < 2) p('실내 통로가 생기려면 이 건물 입구 2개 이상을 "사용 가능"으로 표시해야 합니다.', 'note');
  } else if (sel.type === 'edge') { const e = BASE_EDGES[sel.i], cur = survey.get(docId)?.attr || 'base';
    h('길 구간'); p(`${CAR.has(e.hw) ? '차도 옆' : '보행로'} (${e.hw}) · ${fmtM(e.len)} · 지도 원본: ${['바깥길', '지붕 있음', '실내'][e.cov]}${e.steps ? ' · 계단' : ''}`);
    card.append(chips([['base', '원본대로'], ['covered', '지붕 있음'], ['indoor', '실내'], ['blocked', '막혀 있음']], cur, v => {
      if (v === 'base') del(docId); else { const c = e.coords[Math.floor(e.coords.length / 2)]; edgeRef.set(docId, e.i); put(docId, { kind: 'edge', edge: e.i, ekey: `${e.way}:${e.u}:${e.v}`, mid: c, attr: v, note: survey.get(docId)?.note || '' }); } }));
    L.polyline(e.coords.map(ll), { renderer: rend, color: css('--accent'), weight: 7, opacity: 0.45, interactive: false }).addTo(lyr.draft); setTimeout(() => { if (!draft) lyr.draft.clearLayers(); }, 1400);
  } else if (sel.type === 'short') { const it = sel.it; if (!it) return; h('직접 그린 지름길');
    card.append(chips([[0, '바깥길'], [1, '지붕 있음'], [2, '실내']], it.cov || 0, v => put(docId, Object.assign({}, it, { cov: v }))));
    const rm = Object.assign(document.createElement('button'), { className: 'btn', textContent: '이 지름길 지우기' }); rm.onclick = () => { del(docId); sel = null; renderInsp(); }; card.append(rm); }
  const ex = survey.get(docId);
  if (ex) { const note = document.createElement('input'); note.type = 'text'; note.id = 'insp-note'; note.placeholder = '메모 (예: 평일 18시 이후 잠김)'; note.value = ex.note || '';
    note.onchange = () => put(docId, Object.assign({}, survey.get(docId), { note: note.value.slice(0, 200) })); card.append(note); }
  box.append(card);
}
function itemLabel(id, it) { const S = { open: '사용 가능', closed: '막힘' };
  if (it.kind === 'ent') return `입구 ${S[it.status]} · ${it.bname || '건물'}`;
  if (it.kind === 'newent') return `새 입구 ${S[it.status]} · ${it.bname || '건물'}`;
  if (it.kind === 'bld') return `통과 가능 · ${it.bname || '건물'}`;
  if (it.kind === 'edge') { const i = resolveEdge(id, it); return `길 ${{ covered: '지붕 있음', indoor: '실내', blocked: '막힘' }[it.attr]} · ${i == null ? '위치 확인 필요' : fmtM(BASE_EDGES[i].len)}`; }
  if (it.kind === 'short') return `지름길 · ${['바깥', '지붕', '실내'][it.cov || 0]}`; return id; }
function renderSurveyList() {
  const items = [...survey.entries()].filter(([, v]) => v.kind !== 'probe').sort((a, b) => (b[1].at || 0) - (a[1].at || 0));
  $('#store-count').textContent = `기록 ${items.length}건`;
  const c = k => items.filter(([, v]) => v.kind === k).length;
  $('#stats').innerHTML = `<div><b>${c('ent')}/${ENT.length}</b><span>OSM 입구 확인</span></div><div><b>${c('newent')}</b><span>새로 찾은 입구</span></div><div><b>${c('bld')}</b><span>통과 가능 건물</span></div><div><b>${items.filter(([, v]) => v.kind === 'edge' && v.attr !== 'blocked').length}</b><span>지붕·실내 길</span></div><div><b>${items.filter(([, v]) => v.kind === 'edge' && v.attr === 'blocked').length}</b><span>막힌 길</span></div><div><b>${c('short')}</b><span>지름길</span></div>`;
  const box = $('#items'); box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<div><span class="hint">아직 기록이 없습니다. 위 도구를 고르고 지도를 눌러 첫 기록을 남기세요.</span></div>'; return; }
  for (const [id, it] of items.slice(0, 80)) { const r = document.createElement('div'), s = document.createElement('span'); s.textContent = itemLabel(id, it) + (it.note ? ` — ${it.note}` : '');
    const b = document.createElement('button'); b.textContent = '삭제'; b.onclick = () => del(id); r.append(s, b); box.append(r); }
}

/* ================= 저장 (공유 저장소 → 없으면 이 브라우저) ================= */
const BAKED = /*__SURVEY__*/{}; // 배포판: 조사 기록 묶음(공유 저장소를 쓸 수 없는 곳에서 기본값)
async function put(id, it) { it = Object.assign({}, it, { at: Date.now() }); survey.set(id, it); afterSurvey(); if (readOnly) return;
  if (dbCol) { try { await dbCol.doc(id).set(it); } catch (e) { if (e && e.code === 'invalid_argument') { readOnly = true; setStatus('읽기 전용: 이 화면에서는 기록을 저장할 수 없습니다', ''); } } }
  else store.set('mwk-survey', Object.fromEntries(survey)); }
async function del(id) { survey.delete(id); edgeRef.delete(id); afterSurvey(); if (dbCol) { try { await dbCol.doc(id).delete(); } catch (e) {} } else store.set('mwk-survey', Object.fromEntries(survey)); }
function setStatus(t, cls) { const s = $('#store-status'); s.textContent = t; s.className = 'status ' + cls; }
function afterSurvey() { G = buildGraph(); drawEdges(); drawEnts(); styleBuildings(); renderSurveyList(); refreshRoute(); if (sel) renderInsp(); }
async function initStore() {
  let ns = null; try { ns = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { ns = null; }
  if (ns) { db = ns; dbCol = db.collection('survey'); setStatus('공유 저장소에 저장 중', 'ok');
    dbCol.onSnapshot(snap => { survey = new Map(snap.docs.filter(d => d.exists).map(d => [d.id, Object.assign({}, d.data())])); edgeRef.clear(); afterSurvey(); }, () => setStatus('저장소 연결이 끊겼습니다. 새로고침해 주세요', ''));
  } else { const saved = store.get('mwk-survey'); survey = new Map(Object.entries(Object.assign({}, BAKED, saved || {})));
    setStatus(Object.keys(BAKED).length ? `현장조사 기록 ${Object.keys(BAKED).length}건 반영됨 · 추가 기록은 이 브라우저에만 저장` : '이 브라우저에만 저장 중 · 파일로 백업하세요', 'local'); afterSurvey(); }
}
$('#btn-export').onclick = async () => {
  const text = JSON.stringify({ app: 'mywaykaist-survey', version: 2, exported: new Date().toISOString(), items: Object.fromEntries(survey) }, null, 1);
  const name = `mywaykaist_survey_${kstParts().date}.json`;
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) {}
  if (dl) { try { await dl.save({ filename: name, data: text }); } catch (e) {} return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; a.click();
};
$('#file-import').onchange = async ev => { const f = ev.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); for (const [id, it] of Object.entries(j.items || {})) await put(id, it); } catch (e) { $('#tool-help').textContent = '파일을 읽지 못했습니다. 이 앱에서 저장한 기록 파일인지 확인해 주세요.'; }
  ev.target.value = ''; };

/* ================= 화면 연결 ================= */
function saveUI() { const { o, d, date, min, w, alpha, noStairs, tool } = st; store.set('mwk-ui2', { o, d, date, min, w, alpha, noStairs, tool }); }
function setTab(t) { st.tab = t; $('#tab-route').setAttribute('aria-pressed', t === 'route'); $('#tab-survey').setAttribute('aria-pressed', t === 'survey');
  $('#sec-route').hidden = t !== 'route'; $('#sec-survey').hidden = t !== 'survey'; sel = null; draft = null; drawDraft(); drawEnts(); styleBuildings(); setTool(st.tool); }
function setTool(t) { st.tool = t; [...document.querySelectorAll('#tools button')].forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t)); $('#tool-help').textContent = HELP[t];
  if (t !== 'short') { draft = null; drawDraft(); } sel = null; styleBuildings(); renderInsp(); saveUI(); }
$('#tab-route').onclick = () => setTab('route'); $('#tab-survey').onclick = () => setTab('survey');
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(b.dataset.t));
['o', 'd'].forEach(k => { $('#pick-' + k).onclick = () => { st.pick = st.pick === k ? null : k; syncPick(); };
  $('#in-' + k).onchange = ev => { const b = BLD.find(x => x.name === ev.target.value.trim()); if (b) setOD(k, nodeForBuilding(b), b.name); }; });
$('#swap').onclick = () => { [st.o, st.d] = [st.d, st.o]; const a = $('#in-o').value; $('#in-o').value = $('#in-d').value; $('#in-d').value = a; saveUI(); refreshRoute(); };
$('#btn-now').onclick = () => { st.live = true; retime(); };
const manualTime = () => { st.live = false; st.date = $('#in-date').value || kstParts().date; st.min = +$('#in-time').value; saveUI(); retime(); };
$('#in-date').onchange = manualTime;
let tq = null; $('#in-time').oninput = () => { const m = +$('#in-time').value; $('#out-time').textContent = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); clearTimeout(tq); tq = setTimeout(manualTime, 120); };
setInterval(() => { if (st.live && document.visibilityState === 'visible') retime(); }, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (st.live && document.visibilityState === 'visible') retime(); });
['d', 's', 'r'].forEach(k => { const el = $('#w-' + k); el.value = st.w[k]; el.oninput = () => { st.w[k] = +el.value; saveUI(); refreshRoute(); }; });
$('#no-stairs').checked = st.noStairs; $('#no-stairs').onchange = ev => { st.noStairs = ev.target.checked; saveUI(); refreshRoute(); };
document.querySelectorAll('#seg-alpha button').forEach(b => { b.setAttribute('aria-pressed', +b.dataset.a === st.alpha); b.onclick = () => { st.alpha = +b.dataset.a; document.querySelectorAll('#seg-alpha button').forEach(x => x.setAttribute('aria-pressed', x === b)); saveUI(); refreshRoute(); }; });
$('#bl').innerHTML = [...new Set(BLD.filter(b => b.name).map(b => b.name))].sort((a, b) => a.localeCompare(b, 'ko')).map(n => `<option value="${n.replace(/"/g, '&quot;')}"></option>`).join('');
$('#foot').innerHTML = `지도 데이터: OpenStreetMap 기여자 (ODbL) · 범위: ${D.meta.region} · 그림자: 건물 ${BLD.length}동(층수 정보 없는 건물은 같은 종류 건물의 중앙값 또는 3층, 층고 ${D.meta.floor_h} m로 가정) + 지도에 등록된 나무 ${TREES.length}그루 · 태양 위치: NOAA 계산식 · 보행 속도 ${WALK} m/s 가정`;

function redrawAll() { drawStatic(); drawShadow(); drawEdges(); drawEnts(); styleBuildings(); legend(); refreshRoute(); }
new MutationObserver(redrawAll).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);

computeSun();
G = buildGraph();
// 처음 화면: 예시 경로(아름관 → 창의학습관). 직접 바꿔 보세요.
if (!st.o || !G.idx.has(st.o)) { const b = BLD.find(x => x.name && x.name.startsWith('아름관')); if (b) st.o = nodeForBuilding(b); }
if (!st.d || !G.idx.has(st.d)) { const b = BLD.find(x => x.name && x.name.startsWith('창의학습관')); if (b) st.d = nodeForBuilding(b); }
map.fitBounds(L.latLngBounds(D.campus.map(ll)), { padding: [12, 12] }); zoomClass();
redrawAll(); syncTimeUI();
$('#in-o').value = labelFor(st.o); $('#in-d').value = labelFor(st.d);
setTool(st.tool);
initStore();
</script>
